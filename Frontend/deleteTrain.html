<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Train</title>
    <link rel="stylesheet" href="/css/deleteTrain.css">
</head>
<body>
    <div class="deleteTrain">
        
        <form action="http://localhost:8080/delete" method="post">

        </form>
    </div>
</body>
