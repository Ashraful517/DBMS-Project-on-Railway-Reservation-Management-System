<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route</title>
    <link rel="stylesheet" href="/css/AddRoute.css">
</head>
<body>


    <div class="routes">
        <form action="http://localhost:8080/routes" method="post">
            <label for="departure_place">Departure Place :</label>
            <input id="departure_place" name="departure_place" placeholder="Departure Place" type="text" required><br>
            <label for="arrival_place">Arrival Place :</label>
            <input id="arrival_place" name="arrival_place" placeholder="Arrival Place" type="text" required><br>
            <label for="distance_km">Distance :</label>
            <input id="distance_km" name="distance_km" placeholder="Distance (km)" type="number" required><br>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
