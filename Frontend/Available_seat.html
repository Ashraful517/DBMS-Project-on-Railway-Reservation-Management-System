<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Seats</title>
    <link rel="stylesheet" href="/css/Available_seats.css">
</head>
<body>
    <div class="available_seats">
        <form action="/available_seats" method="get">
            <label for="train_id">Train ID:</label>
            <input id="train_id" name="train_id" placeholder="Train ID" type="text" required><br>
            <label for="route_id">Route ID:</label>
            <input id="route_id" name="route_id" placeholder="Route ID" type="text" required><br>
            <button type="submit">Show Seats</button>
        </form>
 
    </div>
</body>
</html>
