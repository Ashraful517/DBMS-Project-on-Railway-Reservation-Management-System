<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/pass_login.css">
</head>
<body>
    <div class="entire">
        <div class="logo">
            <img src="/view/bdrailway.png" alt="logo">
        </div>
        <div class="login">
            <form id="loginForm" action="/pass_login" method="POST">
                <label for="email"> Email :</label>
                <input id="email" name="email" type="text" required>
                <br><br>
                <label for="password"> Password :</label>
                <input id="password" name="password" type="password" required>
                <button type="submit">Log in</button>
                <p>Don't registered? <a href="pass_register">click here</a></p>
            </form>
            
        </div>       
    </div>

    <!-- <script src="pass_login.js"></script> -->
</body>
</html>
