<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Email for Ticket</title>
    <link rel="stylesheet" href="/css/email-input.css">
</head>
<body>
    <div class="container">
        <h1>Enter Your Email: </h1>
        <form id="emailForm" action="/view_ticket" method="get">
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" required />
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
